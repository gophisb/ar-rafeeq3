<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>الرفيق — رفيقك إلى الخير</title>
    <link rel="stylesheet" href="./style.css">

<body>
<div class="max">
    <header class="topbar">
        <div class="titlebox"><h1>الرفيق</h1><p>رَفِيقُكَ إِلَى الخَيْرِ</p></div>
        <div id="themeToggle" style="cursor:pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
        </div>
    </header>
    <div class="pillrow">
        <div class="pill" id="hijriPill">...</div>
        <div class="pill"><select id="citySelect"></select></div>
    </div>
    <section class="card prayer-main" id="prayerCard">
        <div class="next-label">الصلاة القادمة</div>
        <div class="next-name" id="nextName">—</div>
        <div class="next-time" id="nextTime">00:00</div>
        <div class="countdown-box" id="countdown">00:00</div>
        <div class="prayer-details" id="prayerDetails"></div>
    </section>
    <section class="adhan-card">
        <div class="mosque-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 8C22 8 14 16 14 26V52H50V26C50 16 42 8 32 8Z" fill="url(#grad1)" stroke="var(--gold)" stroke-width="1.5"/>
                <path d="M8 52H56" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
                <path d="M20 52V38C20 32 32 28 44 38V52" stroke="var(--gold)" stroke-width="1.5"/>
                <circle cx="32" cy="18" r="4" fill="var(--gold-light)"/><path d="M32 4V8" stroke="var(--gold)" stroke-width="2"/>
                <defs><linearGradient id="grad1" x1="32" y1="8" x2="32" y2="52" gradientUnits="userSpaceOnUse"><stop stop-color="var(--emerald)"/><stop offset="1" stop-color="var(--emerald-dark)"/></linearGradient></defs>
            </svg>
        </div>
        <div class="adhan-mid"><div class="t1">الأذان القادم</div><div class="t2" id="adhanTimeLabel">—</div></div>
        <button id="adhanPlayBtn" class="adhan-play"><svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7Z"/></svg></button>
    </section>
    <div class="grid2">
        <a href="quran.html" class="feat-card"><div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div><div class="t">القرآن</div></a>
        <a href="qibla.html" class="feat-card"><div class="icon-wrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg></div><div class="t">القبلة</div></a>
        <a href="azkar.html" class="feat-card"><div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></div><div class="t">الأذكار</div></a>
        <a href="tafsir.html" class="feat-card"><div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div><div class="t">التفسير</div></a>
    </div>
