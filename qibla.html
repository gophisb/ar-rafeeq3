<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#080B10">

    <title>الرفيق — بوصلة القبلة</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        :root {
            --q-bg: #081712;
            --q-card: #10251e;
            --q-gold: #d4af37;
            --q-gold-light: #f3dc8b;
            --q-text: #eee7d8;
            --q-muted: #9aa9a2;
            --q-green: #35c98a;
            --q-red: #df6565;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--q-bg);
            color: var(--q-text);
            font-family: "Tajawal", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .q-page {
            width: 100%;
            max-width: 430px;
            margin: auto;
            padding: 14px 14px 35px;
        }

        .q-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .q-back {
            color: var(--q-gold);
            text-decoration: none;
            font-size: 14px;
        }

        .q-title {
            margin: 0;
            color: var(--q-gold);
            font-family: "Amiri", serif;
            font-size: 27px;
        }

        .q-sub {
            text-align: center;
            color: var(--q-muted);
            font-size: 12px;
            margin: 4px 0 13px;
        }

        .info {
            padding: 13px;
            border-radius: 17px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(212,175,55,.17);
            color: #c7d1cc;
            font-size: 12px;
            line-height: 1.85;
            text-align: center;
            margin-bottom: 12px;
        }

        .start {
            width: 100%;
            border: 0;
            border-radius: 15px;
            padding: 14px;
            background: linear-gradient(135deg,#d4af37,#9f7820);
            color: #10140f;
            font: 800 16px "Tajawal", sans-serif;
            cursor: pointer;
        }

        .start:disabled {
            opacity: .65;
        }

        .status {
            min-height: 45px;
            text-align: center;
            padding: 9px 4px;
            color: var(--q-gold-light);
            font-size: 12px;
            line-height: 1.7;
        }

        .status.good {
            color: var(--q-green);
        }

        .status.error {
            color: #ef9898;
        }

        .compass {
            position: relative;
            width: min(88vw, 355px);
            height: min(88vw, 355px);
            margin: 4px auto 15px;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #274d3d 0%,
                    #17382d 43%,
                    #0c2019 78%,
                    #07130f 100%
                );

            border: 2px solid rgba(212,175,55,.8);

            box-shadow:
                0 0 35px rgba(212,175,55,.12),
                inset 0 0 35px rgba(0,0,0,.55);
        }

        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(212,175,55,.42);
        }

        .ring.one {
            inset: 8%;
        }

        .ring.two {
            inset: 18%;
            border-style: dashed;
            border-color: rgba(212,175,55,.24);
        }

        .plate {
            position: absolute;
            inset: 8%;
            transition: transform .12s linear;
            will-change: transform;
        }

        .letter {
            position: absolute;
            font: 700 14px Arial, sans-serif;
        }

        .letter.n {
            top: 4%;
            left: 50%;
            transform: translateX(-50%);
            color: var(--q-red);
        }

        .letter.e {
            top: 50%;
            right: 4%;
            transform: translateY(-50%);
            color: #b8c2bd;
        }

        .letter.s {
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            color: #b8c2bd;
        }

        .letter.w {
            top: 50%;
            left: 4%;
            transform: translateY(-50%);
            color: #b8c2bd;
        }

        .north-pointer {
            position: absolute;
            left: 50%;
            top: 5px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 18px solid var(--q-gold);
            filter: drop-shadow(0 0 8px rgba(212,175,55,.65));
            z-index: 20;
        }

        .qibla-pointer {
            position: absolute;
            inset: 5%;
            transition: transform .12s linear;
            will-change: transform;
            z-index: 12;
            pointer-events: none;
        }

        .kaaba {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            filter: drop-shadow(0 0 10px rgba(212,175,55,.75));
        }

        .q-line {
            position: absolute;
            top: 42px;
            left: 50%;
            width: 3px;
            height: 23%;
            transform: translateX(-50%);
            background: linear-gradient(
                to bottom,
                var(--q-gold-light),
                transparent
            );
            box-shadow: 0 0 11px rgba(212,175,55,.55);
            border-radius: 10px;
        }

        .center {
            position: absolute;
            z-index: 15;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1c16;
            border: 1px solid rgba(212,175,55,.5);
            box-shadow: 0 0 22px rgba(0,0,0,.5);
            font-size: 34px;
        }

        .details {
            padding: 14px;
            border-radius: 17px;
            background: rgba(255,255,255,.035);
            border: 1px solid rgba(212,175,55,.16);
            text-align: center;
        }

        .label {
            color: var(--q-muted);
            font-size: 11px;
        }

        .bearing {
            color: var(--q-gold-light);
            font: 800 34px Arial, sans-serif;
            margin: 3px 0;
        }

        .direction {
            color: var(--q-text);
            font: 700 19px "Amiri", serif;
        }

        .relative {
            color: var(--q-muted);
            font-size: 11px;
            margin-top: 4px;
        }

        .location {
            color: #7f9088;
            font-size: 10px;
            margin-top: 9px;
        }

        .help {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 14px;
            background: rgba(180,120,65,.11);
            border: 1px solid rgba(212,175,55,.18);
            color: #d2c19f;
            font-size: 11px;
            line-height: 1.8;
        }

        .help.show {
            display: block;
        }

        .footer {
            text-align: center;
            color: #65736c;
            font-size: 10px;
            margin-top: 14px;
        }
    </style>
</head>

<body>

<div class="q-page">

    <div class="q-head">

        <a
            class="q-back"
            href="./index.html"
        >
            ← الرئيسية
        </a>

        <h1 class="q-title">
            القبلة
        </h1>

        <span>🧭</span>

    </div>

    <div class="q-sub">
        تحديد اتجاه الكعبة من موقعك
    </div>

    <div class="info">
        اضغط تشغيل، اسمح بالموقع ومستشعر الاتجاه إذا طلبهما الهاتف،
        ثم حرّك الهاتف ببطء على شكل 8 لمعايرة البوصلة.
    </div>

    <button
        id="startBtn"
        class="start"
        type="button"
    >
        تشغيل بوصلة القبلة
    </button>

    <div
        id="status"
        class="status"
    >
        في انتظار التشغيل...
    </div>

    <div class="compass">

        <div class="ring one"></div>
        <div class="ring two"></div>

        <div
            id="plate"
            class="plate"
        >
            <div class="letter n">N</div>
            <div class="letter e">E</div>
            <div class="letter s">S</div>
            <div class="letter w">W</div>
        </div>

        <div class="north-pointer"></div>

        <div
            id="qiblaPointer"
            class="qibla-pointer"
        >
            <div class="kaaba">🕋</div>
            <div class="q-line"></div>
        </div>

        <div class="center">
            🕋
        </div>

    </div>

    <div class="details">

        <div class="label">
            اتجاه القبلة من الشمال الحقيقي
        </div>

        <div
            id="bearing"
            class="bearing"
        >
            —
        </div>

        <div
            id="direction"
            class="direction"
        >
            —
        </div>

        <div
            id="relative"
            class="relative"
        >
            —
        </div>

        <div
            id="location"
            class="location"
        >
            الموقع: —
        </div>

    </div>

    <div
        id="help"
        class="help"
    ></div>

    <div class="footer">
        الرفيق — بوصلة القبلة
    </div>

</div>


<script>
(function () {

    "use strict";

    const KAABA_LAT = 21.4225;
    const KAABA_LNG = 39.8262;

    const startBtn =
        document.getElementById("startBtn");

    const statusEl =
        document.getElementById("status");

    const plateEl =
        document.getElementById("plate");

    const qiblaPointerEl =
        document.getElementById("qiblaPointer");

    const bearingEl =
        document.getElementById("bearing");

    const directionEl =
        document.getElementById("direction");

    const relativeEl =
        document.getElementById("relative");

    const locationEl =
        document.getElementById("location");

    const helpEl =
        document.getElementById("help");


    let qiblaBearing = null;
    let currentHeading = null;
    let compassSupported = false;
    let headingBuffer = [];


    function toRad(value) {
        return value * Math.PI / 180;
    }


    function toDeg(value) {
        return value * 180 / Math.PI;
    }


    function normalize(value) {
        return ((value % 360) + 360) % 360;
    }


    function calculateQibla(lat, lng) {

        const phi1 = toRad(lat);
        const phi2 = toRad(KAABA_LAT);
        const delta =
            toRad(KAABA_LNG - lng);

        const y = Math.sin(delta);

        const x =
            Math.cos(phi1) * Math.tan(phi2)
            -
            Math.sin(phi1) * Math.cos(delta);

        return normalize(
            toDeg(Math.atan2(y, x))
        );
    }


    function smoothHeading(raw) {

        headingBuffer.push(
            normalize(raw)
        );

        if (headingBuffer.length > 5) {
            headingBuffer.shift();
        }

        let sin = 0;
        let cos = 0;

        headingBuffer.forEach(
            function (value) {

                sin += Math.sin(
                    toRad(value)
                );

                cos += Math.cos(
                    toRad(value)
                );
            }
        );

        return normalize(
            toDeg(
                Math.atan2(sin, cos)
            )
        );
    }


    function directionName(angle) {

        if (
            angle < 22.5 ||
            angle >= 337.5
        ) return "شمال";

        if (angle < 67.5) return "شمال شرقي";
        if (angle < 112.5) return "شرق";
        if (angle < 157.5) return "جنوب شرقي";
        if (angle < 202.5) return "جنوب";
        if (angle < 247.5) return "جنوب غربي";
        if (angle < 292.5) return "غرب";

        return "شمال غربي";
    }


    function updateUI() {

        if (qiblaBearing === null) {
            return;
        }

        bearingEl.textContent =
            Math.round(qiblaBearing) + "°";

        directionEl.textContent =
            directionName(qiblaBearing);


        if (currentHeading === null) {

            plateEl.style.transform =
                "rotate(0deg)";

            qiblaPointerEl.style.transform =
                "rotate(" +
                qiblaBearing +
                "deg)";

            relativeEl.textContent =
                "اتجاه القبلة محسوب من موقعك — في انتظار البوصلة";

            return;
        }


        plateEl.style.transform =
            "rotate(" +
            (-currentHeading) +
            "deg)";


        const relative =
            normalize(
                qiblaBearing -
                currentHeading
            );


        qiblaPointerEl.style.transform =
            "rotate(" +
            relative +
            "deg)";


        const difference =
            Math.min(
                relative,
                360 - relative
            );


        if (difference <= 5) {

            statusEl.textContent =
                "✅ أنت تواجه القبلة تقريبًا";

            statusEl.className =
                "status good";

            relativeEl.textContent =
                "القبلة أمامك مباشرة";

        } else {

            statusEl.textContent =
                "✅ البوصلة تعمل — حرّك الهاتف حتى يتجه 🕋 للأعلى";

            statusEl.className =
                "status";

            relativeEl.textContent =
                "الانحراف عن القبلة: " +
                Math.round(difference) +
                "°";
        }
    }


    function handleOrientation(event) {

        let heading = null;


        if (
            typeof event.webkitCompassHeading ===
            "number" &&
            Number.isFinite(
                event.webkitCompassHeading
            )
        ) {

            heading =
                event.webkitCompassHeading;

        } else if (
            typeof event.alpha ===
            "number" &&
            Number.isFinite(event.alpha)
        ) {

            heading =
                360 - event.alpha;
        }


        if (
            heading === null
        ) {
            return;
        }


        compassSupported = true;

        currentHeading =
            smoothHeading(heading);

        updateUI();
    }


    function getLocation() {

        return new Promise(
            function (resolve, reject) {

                if (!navigator.geolocation) {

                    reject(
                        new Error(
                            "الموقع غير مدعوم"
                        )
                    );

                    return;
                }


                navigator.geolocation.getCurrentPosition(

                    resolve,

                    reject,

                    {
                        enableHighAccuracy: true,
                        maximumAge: 10000,
                        timeout: 15000
                    }
                );
            }
        );
    }


    async function requestPermission() {

        if (
            typeof DeviceOrientationEvent !==
                "undefined" &&
            typeof DeviceOrientationEvent.requestPermission ===
                "function"
        ) {

            const permission =
                await DeviceOrientationEvent
                    .requestPermission();

            if (
                permission !== "granted"
            ) {

                throw new Error(
                    "تم رفض إذن مستشعر الاتجاه"
                );
            }
        }
    }


    async function startCompass() {

        await requestPermission();


        if (
            !("DeviceOrientationEvent" in window)
        ) {

            throw new Error(
                "المتصفح لا يدعم مستشعر الاتجاه"
            );
        }


        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );


        window.addEventListener(
            "deviceorientationabsolute",
            handleOrientation,
            true
        );


        setTimeout(
            function () {

                if (!compassSupported) {

                    statusEl.textContent =
                        "⚠️ لم يرسل المتصفح بيانات البوصلة";

                    statusEl.className =
                        "status error";

                    helpEl.classList.add("show");

                    helpEl.innerHTML =
                        "تم تحديد القبلة من موقعك، لكن Chrome لم يرسل قراءة مستشعر الاتجاه." +
                        "<br><br>" +
                        "حرّك الهاتف على شكل رقم 8 عدة مرات، وأبعده عن المعادن والمغناطيس، ثم اضغط إعادة التشغيل.";

                    updateUI();
                }

            },
            2500
        );
    }


    async function startApp() {

        startBtn.disabled = true;

        startBtn.textContent =
            "جاري التشغيل...";

        helpEl.classList.remove("show");


        try {

            statusEl.textContent =
                "جاري تحديد موقعك...";

            statusEl.className =
                "status";


            const position =
                await getLocation();


            const lat =
                position.coords.latitude;

            const lng =
                position.coords.longitude;


            qiblaBearing =
                calculateQibla(
                    lat,
                    lng
                );


            locationEl.textContent =
                "الموقع: " +
                lat.toFixed(4) +
                " ، " +
                lng.toFixed(4);


            updateUI();


            statusEl.textContent =
                "تم تحديد القبلة — جارٍ تشغيل البوصلة...";


            await startCompass();


            startBtn.textContent =
                "البوصلة تعمل";


        } catch (error) {

            console.error(error);

            statusEl.textContent =
                "❌ " +
                (
                    error.message ||
                    "تعذر تشغيل البوصلة"
                );

            statusEl.className =
                "status error";


            helpEl.classList.add("show");

            helpEl.innerHTML =
                "تأكد من السماح للموقع ومستشعر الاتجاه، وأن الصفحة تعمل عبر HTTPS.";


            startBtn.disabled = false;

            startBtn.textContent =
                "إعادة تشغيل البوصلة";
        }
    }


    startBtn.addEventListener(
        "click",
        startApp
    );

})();
</script>

</body>
</html>
