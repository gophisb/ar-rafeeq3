<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>بوصلة القبلة — الرفيق</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }

    body {
      font-family: Arial, "Tajawal", sans-serif;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle, #202020, #080808 60%, #000);
    }

    .top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
    }

    .top a {
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }

    .title {
      font-weight: bold;
    }

    .direction {
      text-align: center;
      margin: 10px 0;
    }

    .direction-name {
      font-size: 26px;
      font-weight: bold;
    }

    .heading {
      font-size: 12px;
      color: #888;
      direction: ltr;
      margin-top: 5px;
    }

    .compass {
      position: relative;
      width: min(90vw, 400px);
      height: min(90vw, 400px);
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .marker {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 22px solid #777;
      z-index: 20;
    }

    .dial {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 3px solid #777;
      background: repeating-conic-gradient(#333 0deg 1deg, transparent 1deg 5deg),
        radial-gradient(circle, #292929, #111);
      box-shadow: inset 0 0 30px #000, 0 0 30px #000;
      will-change: transform;
    }

    .cardinal {
      position: absolute;
      inset: 0;
      font-size: 19px;
      font-weight: bold;
    }

    .cardinal span {
      position: absolute;
    }

    .n {
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: #f33;
    }

    .e {
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .s {
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }

    .w {
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    .qibla {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      z-index: 15;
      transform: translate(-50%, -50%) rotate(0deg);
      will-change: transform;
    }

    .qibla:after {
      content: "";
      position: absolute;
      width: 4px;
      height: 125px;
      left: -2px;
      top: -140px;
      background: #d4af37;
      border-radius: 5px;
      box-shadow: 0 0 12px #d4af37;
    }

    .qibla:before {
      content: "🕋";
      position: absolute;
      left: 50%;
      top: -175px;
      transform: translateX(-50%);
      font-size: 27px;
    }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 17px;
      height: 17px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fff;
      border: 3px solid #222;
      z-index: 30;
    }

    .number {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 58px;
      font-weight: 300;
      direction: ltr;
      z-index: 10;
    }

    .info {
      text-align: center;
      margin-top: 15px;
    }

    .qibla-text {
      color: #d4af37;
      font-weight: bold;
    }

    .qibla-angle {
      color: #888;
      font-size: 12px;
      margin-top: 5px;
      direction: ltr;
    }

    .status {
      color: #888;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      padding: 0 20px;
    }

    .good {
      color: #3ea86a;
    }

    .bad {
      color: #e07a5f;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .box .icon {
      font-size: 55px;
    }

    .box h2 {
      margin: 10px;
    }

    .box p {
      color: #888;
      font-size: 13px;
      line-height: 1.8;
    }

    #start {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #d4af37;
      color: #000;
      font-size: 16px;
      font-weight: bold;
    }

    #error {
      display: none;
      color: #e07a5f;
      font-size: 12px;
      margin-top: 12px;
      line-height: 1.8;
    }

    .aligned {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #181818;
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 12px 20px;
      border-radius: 30px;
      z-index: 50;
      white-space: nowrap;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <a href="./index.html">← الرئيسية</a>
      <div class="title">بوصلة القبلة</div>
      <div>🧭</div>
    </div>

    <div class="direction">
      <div class="direction-name" id="direction">—</div>
      <div class="heading" id="heading">—</div>
    </div>

    <div class="compass">
      <div class="marker"></div>
      <div class="dial" id="dial">
        <div class="cardinal">
          <span class="n">N</span>
          <span class="e">E</span>
          <span class="s">S</span>
          <span class="w">W</span>
        </div>
      </div>
      <div class="qibla" id="qibla"></div>
      <div class="center"></div>
      <div class="number" id="number">0°</div>
    </div>

    <div class="info">
      <div class="qibla-text" id="qiblaText">تحديد اتجاه القبلة...</div>
      <div class="qibla-angle" id="qiblaAngle">—</div>
    </div>

    <div class="status" id="status">في انتظار تشغيل البوصلة</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="box">
      <div class="icon">🕋</div>
      <h2>بوصلة القبلة</h2>
      <p>اضغط تشغيل للسماح بالوصول إلى موقعك ومستشعرات البوصلة في هاتفك. <br>لأفضل دقة، ابتعد عن المعادن والأجهزة الإلكترونية.</p>
      <button id="start">تشغيل البوصلة</button>
      <div id="error"></div>
    </div>
  </div>

  <div class="aligned" id="aligned">🕋 أنت متجه نحو القبلة</div>

  <script>
    const KAABA = {
      lat: 21.4225,
      lng: 39.8262
    };

    let qiblaBearing = null;
    let heading = null;
    let smoothHeading = null;
    let lastHeading = null;
    let stability = 0;
    let aligned = false;

    const $ = id => document.getElementById(id);

    function angleDiff(a, b) {
      return ((a - b + 540) % 360) - 180;
    }

    function calculateQibla(lat, lng) {
      const r = Math.PI / 180;
      const p1 = lat * r;
      const p2 = KAABA.lat * r;
      const dl = (KAABA.lng - lng) * r;
      const y = Math.sin(dl) * Math.cos(p2);
      const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
      return (Math.atan2(y, x) / r + 360) % 360;
    }

    function smooth(old, value) {
      if (old === null) return value;
      let d = angleDiff(value, old);
      let factor = 0.18;
      if (Math.abs(d) > 20) factor = 0.35;
      if (Math.abs(d) > 60) factor = 0.5;
      return (old + d * factor + 360) % 360;
    }

    function getDirection(deg) {
      const names = [
        "الشمال",
        "الشمال الشرقي",
        "الشرق",
        "الجنوب الشرقي",
        "الجنوب",
        "الجنوب الغربي",
        "الغرب",
        "الشمال الغربي"
      ];
      return names[Math.round(deg / 45) % 8];
    }

    function updateCompass(raw) {
      raw = (raw + 360) % 360;
      if (lastHeading !== null) {
        const d = Math.abs(angleDiff(raw, lastHeading));
        stability = stability * 0.9 + d * 0.1;
      }
      lastHeading = raw;
      smoothHeading = smooth(smoothHeading, raw);
      heading = smoothHeading;

      $("number").textContent = Math.round(heading) + "°";
      $("heading").textContent = Math.round(heading) + "°";
      $("direction").textContent = getDirection(heading);
      $("dial").style.transform = `rotate(${-heading}deg)`;

      const relative = angleDiff(qiblaBearing, heading);
      $("qibla").style.transform = `translate(-50%, -50%) rotate(${relative}deg)`;

      if (stability < 1.5) {
        $("status").textContent = "✅ المستشعر مستقر — دقة عالية";
        $("status").className = "status good";
      } else if (stability < 5) {
        $("status").textContent = "📡 استقرار متوسط — ثبّت الهاتف";
        $("status").className = "status";
      } else {
        $("status").textContent = "⚠️ تذبذب مرتفع — حرّك الهاتف على شكل 8";
        $("status").className = "status bad";
      }

      if (Math.abs(relative) <= 4) {
        $("aligned").style.display = "block";
        if (!aligned) {
          aligned = true;
          if (navigator.vibrate) {
            navigator.vibrate([70, 40, 70]);
          }
        }
      } else {
        $("aligned").style.display = "none";
        aligned = false;
      }
    }

    function startOrientation() {
      window.addEventListener("deviceorientation", function (e) {
        let value = null;
        if (typeof e.webkitCompassHeading === "number") {
          value = e.webkitCompassHeading;
        } else if (typeof e.alpha === "number") {
          value = 360 - e.alpha;
        }
        if (value !== null) {
          updateCompass(value);
        }
      }, true);
    }

    async function requestSensorPermission() {
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") {
          throw new Error("تم رفض صلاحية مستشعر البوصلة.");
        }
      }
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        });
      });
    }

    async function startCompass() {
      const button = $("start");
      const error = $("error");
      try {
        button.disabled = true;
        button.textContent = "جاري التشغيل...";
        if (!navigator.geolocation) {
          throw new Error("GPS غير مدعوم في هذا المتصفح.");
        }
        const position = await getLocation();
        qiblaBearing = calculateQibla(position.coords.latitude, position.coords.longitude);
        $("qiblaAngle").textContent = "زاوية القبلة: " + Math.round(qiblaBearing) + "°";
        $("qiblaText").textContent = "🕋 تم تحديد اتجاه القبلة";
        await requestSensorPermission();
        startOrientation();
        $("overlay").style.display = "none";
        $("status").textContent = "📡 البوصلة تعمل — حرّك الهاتف ببطء للمعايرة";
      } catch (e) {
        error.style.display = "block";
        error.textContent = e.message || "تعذر تشغيل البوصلة. تأكد من تشغيل GPS والسماح بالمستشعر.";
        button.disabled = false;
        button.textContent = "إعادة المحاولة";
      }
    }

    $("start").addEventListener("click", startCompass);
  </script>
</body>
</html>
