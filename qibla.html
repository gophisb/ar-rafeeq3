<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>الرفيق - بوصلة القبلة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a1f1a;
      font-family: 'Tajawal', 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #e6d5b8;
      overflow: hidden;
      direction: rtl;
    }

    .compass-container {
      position: relative;
      width: 90vw;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .compass-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, #1e3b2f 0%, #0a1f1a 80%);
      box-shadow: 0 0 40px rgba(172, 145, 75, 0.3), inset 0 0 30px rgba(0,0,0,0.6);
      border: 2px solid #b49450;
    }

    .compass-rose {
      position: absolute;
      width: 85%;
      height: 85%;
      top: 7.5%;
      left: 7.5%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #2a4a38 0deg 45deg, #1a3525 45deg 90deg, #2a4a38 90deg 135deg, #1a3525 135deg 180deg, #2a4a38 180deg 225deg, #1a3525 225deg 270deg, #2a4a38 270deg 315deg, #1a3525 315deg 360deg);
      border: 1px solid #b49450;
      box-shadow: inset 0 0 20px #00000066;
      transition: transform 0.1s linear;
      will-change: transform;
    }

    .markers {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .north-marker, .qibla-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 8px black;
      font-weight: bold;
    }

    .north-marker {
      font-size: 1.4rem;
      color: #d4af37;
      top: 10%;
      left: 50%;
    }

    .qibla-marker {
      font-size: 2rem;
      color: #f5e6c6;
      background: rgba(10, 31, 26, 0.7);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px gold;
    }

    .needle {
      position: absolute;
      top: 5%;
      left: 50%;
      width: 3px;
      height: 45%;
      background: linear-gradient(to bottom, gold 0%, #b49450 80%, transparent);
      transform-origin: bottom center;
      transform: translateX(-50%);
      border-radius: 2px;
      box-shadow: 0 0 12px gold;
      z-index: 5;
      transition: transform 0.1s linear;
    }

    .qibla-direction-text {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      background: rgba(0,0,0,0.5);
      padding: 0.5rem 2rem;
      border-radius: 30px;
      border: 1px solid #b49450;
      letter-spacing: 1px;
      z-index: 10;
    }

    .status-message {
      color: #b49450;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      text-align: center;
    }

    .kaaba-icon {
      font-size: 2.8rem;
      filter: drop-shadow(0 0 10px gold);
    }
  </style>
</head>
<body>
  <div class="compass-container">
    <div class="compass-bg"></div>
    <div class="compass-rose" id="compassRose">
      <div class="markers">
        <div class="north-marker">شمال</div>
      </div>
    </div>
    <div class="needle" id="needle"></div>
    <div class="qibla-marker" id="qiblaMarker" style="top: 85%; left: 50%;">🕋</div>
    <div class="qibla-direction-text" id="directionText">جاري تحديد القبلة...</div>
    <div class="status-message" id="statusMsg">يتم تشغيل المستشعرات المتطورة...</div>
  </div>

  <script>
    (function() {
      // إحداثيات الكعبة
      const KAABA_LAT = 21.4225;
      const KAABA_LNG = 39.8262;

      let userLat, userLng, qiblaBearing;
      let currentHeading = 0; // درجة انحراف الشمال عن مقدمة الجهاز (صفر = الشمال الحقيقي)
      let compassRose = document.getElementById('compassRose');
      let needle = document.getElementById('needle');
      let directionText = document.getElementById('directionText');
      let statusMsg = document.getElementById('statusMsg');

      // حساب زاوية القبلة من موقع المستخدم
      function computeQiblaBearing(lat, lng) {
        const φ1 = lat * Math.PI / 180;
        const φ2 = KAABA_LAT * Math.PI / 180;
        const Δλ = (KAABA_LNG - lng) * Math.PI / 180;
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        const θ = Math.atan2(y, x);
        return (θ * 180 / Math.PI + 360) % 360;
      }

      // تحديث الواجهة بناءً على heading الحالي وزاوية القبلة
      function updateUI() {
        if (qiblaBearing === undefined || currentHeading === undefined) return;
        // الزاوية التي تدير بها البوصلة: يجب أن تشير علامة الشمال إلى الشمال الحقيقي
        // لذا ندير وردة البوصلة بعكس heading (لأن device facing north => heading = 0 => rotate(0))
        // و علامة الشمال ثابتة فوق الوردة.
        const roseRotation = -currentHeading;
        compassRose.style.transform = `rotate(${roseRotation}deg)`;

        // إبرة القبلة: الفرق بين اتجاه القبلة واتجاه نظر الجهاز
        // نريد أن نشير إلى القبلة باتجاه عقارب الساعة من مقدمة الجهاز
        let relativeQibla = (qiblaBearing - currentHeading + 360) % 360;
        // تحويلها لتدوير الإبرة (التي موضعها الأعلى بشكل افتراضي) باتجاه القبلة
        needle.style.transform = `translateX(-50%) rotate(${relativeQibla}deg)`;

        let dirText = '';
        if (relativeQibla < 10 || relativeQibla > 350) dirText = 'القبلة أمامك مباشرة 🎯';
        else if (relativeQibla < 45) dirText = 'القبلة إلى يسارك قليلاً';
        else if (relativeQibla < 135) dirText = 'القبلة إلى يسارك';
        else if (relativeQibla < 180) dirText = 'القبلة خلفك يساراً';
        else if (relativeQibla < 225) dirText = 'القبلة خلفك';
        else if (relativeQibla < 315) dirText = 'القبلة إلى يمينك';
        else dirText = 'القبلة إلى يمينك قليلاً';

        directionText.textContent = `${dirText} (${Math.round(relativeQibla)}°)`;
        statusMsg.textContent = `شمال ${Math.round(currentHeading)}° | القبلة ${Math.round(qiblaBearing)}°`;
      }

      // ====================== 1. مستشعر الاتجاه المطلق (الأحدث) ======================
      async function tryAbsoluteOrientationSensor() {
        if (typeof AbsoluteOrientationSensor !== 'function') return false;
        try {
          const sensor = new AbsoluteOrientationSensor({ frequency: 60, referenceFrame: 'device' });
          sensor.addEventListener('reading', () => {
            const q = sensor.quaternion;
            if (!q) return;
            // تحويل الكواتيرنيون إلى زوايا أويلر (yaw هو heading الحقيقي من الشمال)
            // الصيغة تعتمد على إطار الأرض (East-North-Up). سنحسب yaw.
            const [x, y, z, w] = q;
            // حساب yaw (دوران حول المحور Z للأرض) - heading
            const siny_cosp = 2 * (w * z + x * y);
            const cosy_cosp = 1 - 2 * (y * y + z * z);
            let headingRad = Math.atan2(siny_cosp, cosy_cosp);
            let headingDeg = (headingRad * 180 / Math.PI + 360) % 360;
            currentHeading = headingDeg;
            updateUI();
          });
          sensor.addEventListener('error', (event) => {
            statusMsg.textContent = 'خطأ في مستشعر الاتجاه المطلق';
            console.error(event.error);
          });
          await sensor.start();
          statusMsg.textContent = '✅ مستشعر الاتجاه المطلق نشط';
          return true;
        } catch (e) {
          console.warn('AbsoluteOrientationSensor غير مدعوم:', e);
          return false;
        }
      }

      // ====================== 2. دمج المستشعرات الخام باستخدام فلتر Madgwick (الخيار الاحترافي) ======================
      async function trySensorFusion() {
        if (typeof Accelerometer !== 'function' || typeof Gyroscope !== 'function' || typeof Magnetometer !== 'function') {
          return false;
        }
        try {
          const accel = new Accelerometer({ frequency: 60, referenceFrame: 'device' });
          const gyro = new Gyroscope({ frequency: 60, referenceFrame: 'device' });
          const mag = new Magnetometer({ frequency: 60, referenceFrame: 'device' });

          // Madgwick AHRS filter
          let q = [1, 0, 0, 0]; // quaternion
          const beta = 0.1; // كسب الفلتر
          const sampleFreq = 60;
          const twoKp = 2.0 * 0.5; // 2 * proportional gain
          const twoKi = 2.0 * 0.0; // 2 * integral gain

          function madgwickAHRSupdate(gx, gy, gz, ax, ay, az, mx, my, mz) {
            let q0 = q[0], q1 = q[1], q2 = q[2], q3 = q[3];
            let recipNorm;
            let s0, s1, s2, s3;
            let hx, hy, bx, bz;
            let _2q0mx, _2q0my, _2q0mz, _2q1mx, _2q2mx, _2q2my, _2q2mz, _2q3mx, _2q3my, _2q3mz;

            // Use IMU algorithm if no magnetometer
            if((mx === 0 && my === 0 && mz === 0) || mx === undefined) {
              // Simplified IMU update (no mag)
              let norm;
              let vx, vy, vz;
              let ex, ey, ez;

              // normalise accelerometer
              norm = Math.sqrt(ax*ax + ay*ay + az*az);
              if (norm === 0) return;
              recipNorm = 1 / norm;
              ax *= recipNorm;
              ay *= recipNorm;
              az *= recipNorm;

              // estimated gravity direction
              vx = 2*(q1*q3 - q0*q2);
              vy = 2*(q0*q1 + q2*q3);
              vz = q0*q0 - q1*q1 - q2*q2 + q3*q3;

              // error is cross product
              ex = (ay*vz - az*vy);
              ey = (az*vx - ax*vz);
              ez = (ax*vy - ay*vx);

              // integral feedback (not used if twoKi = 0)
              // proportional feedback
              let step = 1 / sampleFreq;

              gx += twoKp * ex;
              gy += twoKp * ey;
              gz += twoKp * ez;

              // integrate quaternion
              q0 += (-q1*gx - q2*gy - q3*gz) * 0.5 * step;
              q1 += ( q0*gx + q2*gz - q3*gy) * 0.5 * step;
              q2 += ( q0*gy - q1*gz + q3*gx) * 0.5 * step;
              q3 += ( q0*gz + q1*gy - q2*gx) * 0.5 * step;

              // normalise
              norm = Math.sqrt(q0*q0 + q1*q1 + q2*q2 + q3*q3);
              q0 /= norm; q1 /= norm; q2 /= norm; q3 /= norm;
              return;
            }

            // Magnetometer present: full AHRS
            // normalise accelerometer
            let norm = Math.sqrt(ax*ax + ay*ay + az*az);
            if (norm === 0) return;
            recipNorm = 1 / norm;
            ax *= recipNorm;
            ay *= recipNorm;
            az *= recipNorm;

            // normalise magnetometer
            norm = Math.sqrt(mx*mx + my*my + mz*mz);
            if (norm === 0) return;
            recipNorm = 1 / norm;
            mx *= recipNorm;
            my *= recipNorm;
            mz *= recipNorm;

            // reference direction of Earth's magnetic field
            _2q0mx = 2*q0*mx; _2q0my = 2*q0*my; _2q0mz = 2*q0*mz;
            _2q1mx = 2*q1*mx; _2q2mx = 2*q2*mx; _2q2my = 2*q2*my;
            _2q2mz = 2*q2*mz; _2q3mx = 2*q3*mx; _2q3my = 2*q3*my; _2q3mz = 2*q3*mz;

            hx = mx*q0*q0 - _2q0my*q3 + _2q0mz*q2 + mx*q1*q1 + _2q1*mx*q2 + mx*q2*q2 - _2q2*mz*q0 + mx*q3*q3 - _2q3*my*q0;
            hy = _2q0mx*q3 + my*q0*q0 - _2q0mz*q1 + _2q1mx*q2 - my*q1*q1 + my*q2*q2 + _2q2*mx*q3 - my*q3*q3 + _2q3*mz*q2;
            bx = Math.sqrt(hx*hx + hy*hy);
            bz = _2q0mx*q2 + _2q0my*q3 + mz*q0*q0 + _2q1mx*q1 - mz*q1*q1 + _2q2*mx*q0 - mz*q2*q2 + mz*q3*q3 - _2q3*my*q2;

            // estimated direction
            _2q0mx = 2*q0*mx; _2q0my = 2*q0*my; _2q0mz = 2*q0*mz;
            _2q1mx = 2*q1*mx; _2q2mx = 2*q2*mx; _2q2my = 2*q2*my;
            _2q2mz = 2*q2*mz; _2q3mx = 2*q3*mx; _2q3my = 2*q3*my; _2q3mz = 2*q3*mz;

            let s0 = -_2q2*(2*q1*q3 - 2*q0*q2) + _2q1*(2*q0*q1 + 2*q2*q3) - bz*(_2q0mx - _2q2mz + _2q3my) + (-_2q0my + _2q1mz + _2q3mx)*bz;
            let s1 = _2q3*(2*q1*q3 - 2*q0*q2) + _2q0*(2*q0*q1 + 2*q2*q3) - 4*q1*(1 - 2*q1*q1 - 2*q2*q2) + bz*(_2q1mx + _2q2my + _2q3mz) + (_2q0mx + _2q2mz - _2q3my)*bz;
            let s2 = -_2q0*(2*q1*q3 - 2*q0*q2) + _2q3*(2*q0*q1 + 2*q2*q3) - 4*q2*(1 - 2*q1*q1 - 2*q2*q2) + (-_2q2mx + _2q0my + _2q3mz)*bz + (_2q0mz + _2q1my - _2q3mx)*bz;
            let s3 = _2q1*(2*q1*q3 - 2*q0*q2) + _2q2*(2*q0*q1 + 2*q2*q3) + (-_2q3mx + _2q0my + _2q2mz)*bz + (-_2q0mz + _2q1my + _2q2mx)*bz;
            recipNorm = 1 / Math.sqrt(s0*s0 + s1*s1 + s2*s2 + s3*s3);
            s0 *= recipNorm; s1 *= recipNorm; s2 *= recipNorm; s3 *= recipNorm;

            // error is cross product
            let ex = (ay*s2 - az*s1);
            let ey = (az*s0 - ax*s2);
            let ez = (ax*s1 - ay*s0);

            // apply feedback
            gx += twoKp * ex;
            gy += twoKp * ey;
            gz += twoKp * ez;

            let step = 1 / sampleFreq;
            q0 += (-q1*gx - q2*gy - q3*gz) * 0.5 * step;
            q1 += ( q0*gx + q2*gz - q3*gy) * 0.5 * step;
            q2 += ( q0*gy - q1*gz + q3*gx) * 0.5 * step;
            q3 += ( q0*gz + q1*gy - q2*gx) * 0.5 * step;

            norm = Math.sqrt(q0*q0 + q1*q1 + q2*q2 + q3*q3);
            q0 /= norm; q1 /= norm; q2 /= norm; q3 /= norm;
          }

          function onSensorReading() {
            if (accel.x === null || gyro.x === null) return;
            // تحويل من rad/s إلى deg/s للجيروسكوب
            madgwickAHRSupdate(
              gyro.x, gyro.y, gyro.z,
              accel.x, accel.y, accel.z,
              mag.x || 0, mag.y || 0, mag.z || 0
            );
            // استخراج yaw من الكواتيرنيون (heading)
            let q0 = q[0], q1 = q[1], q2 = q[2], q3 = q[3];
            let siny_cosp = 2 * (q0 * q3 + q1 * q2);
            let cosy_cosp = 1 - 2 * (q2 * q2 + q3 * q3);
            let headingRad = Math.atan2(siny_cosp, cosy_cosp);
            let headingDeg = (headingRad * 180 / Math.PI + 360) % 360;
            currentHeading = headingDeg;
            updateUI();
          }

          accel.addEventListener('reading', onSensorReading);
          gyro.addEventListener('reading', onSensorReading);
          mag.addEventListener('reading', onSensorReading);

          await Promise.all([accel.start(), gyro.start(), mag.start()]);
          statusMsg.textContent = '✅ اندماج المستشعرات (Madgwick) نشط';
          return true;
        } catch (e) {
          console.warn('فشل تشغيل مستشعرات الاندماج:', e);
          return false;
        }
      }

      // ====================== 3. بديل: DeviceOrientationEvent (قد يتجمد) ======================
      function fallbackToDeviceOrientation() {
        if (typeof DeviceOrientationEvent === 'undefined') return false;
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
        window.addEventListener('deviceorientation', handleOrientation, true);
        statusMsg.textContent = '⚠️ وضع الطوارئ (مستشعر المتصفح الأساسي)';
        return true;
      }

      function handleOrientation(event) {
        let alpha;
        if (event.webkitCompassHeading) {
          alpha = event.webkitCompassHeading; // مقياس مباشر
        } else if (event.absolute && event.alpha !== null) {
          alpha = 360 - event.alpha; // alpha عكس عقارب الساعة من الشمال (نحن نحتاج مع عقارب)
        } else if (event.alpha !== null) {
          alpha = 360 - event.alpha; // غير مضمون الدقة
        } else {
          return;
        }
        currentHeading = (alpha % 360 + 360) % 360;
        updateUI();
      }

      // بدء طلب الموقع ثم تفعيل أفضل مستشعر
      async function start() {
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            });
          });
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          qiblaBearing = computeQiblaBearing(userLat, userLng);
          directionText.textContent = `القبلة على ${Math.round(qiblaBearing)}° من الشمال`;
        } catch (e) {
          statusMsg.textContent = 'فشل تحديد الموقع - يرجى السماح بالوصول للموقع';
          console.error(e);
          return;
        }

        // محاولة المستشعرات المتطورة بالترتيب
        let fusionSuccess = await tryAbsoluteOrientationSensor();
        if (!fusionSuccess) {
          fusionSuccess = await trySensorFusion();
        }
        if (!fusionSuccess) {
          fallbackToDeviceOrientation();
        }
      }

      start();
    })();
  </script>
</body>
</html>
