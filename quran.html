<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>القرآن الكريم — الرفيق</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        .quran-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px;
        }

        .quran-header {
            text-align: center;
            padding: 20px 0 14px;
        }

        .quran-header h2 {
            margin: 0;
            color: var(--gold);
            font-family: "Amiri", serif;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin: 12px 0 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--gold);
        }

        .search-status {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            min-height: 20px;
            margin-bottom: 8px;
        }

        .surah-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .surah-item {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-bottom: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
        }

        .surah-item:active {
            transform: scale(0.99);
        }

        .surah-main {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .surah-number {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 9px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.10);
            color: var(--gold);
            font-size: 0.75rem;
            font-family: Arial, sans-serif;
        }

        .surah-name {
            color: var(--gold);
            font-family: "Amiri", serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .surah-count {
            color: var(--muted);
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 18px;
            border-radius: 99px;
            margin-bottom: 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .section-title {
            text-align: center;
            color: var(--gold);
            font-family: "Amiri", serif;
            margin: 8px 0 18px;
        }

        .ayah-card {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            line-height: 2.2;
            font-family: "Amiri", serif;
            font-size: 1.16rem;
        }

        .ayah-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 29px;
            height: 29px;
            padding: 0 5px;
            margin-left: 8px;
            border: 1px solid rgba(212,175,55,0.35);
            border-radius: 50%;
            color: var(--gold);
            font-size: 0.78rem;
            line-height: 1;
            vertical-align: middle;
            font-family: Arial, sans-serif;
        }

        .tafsir-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 0.72rem;
            cursor: pointer;
            margin-right: 8px;
            vertical-align: middle;
            font-family: inherit;
        }

        .tafsir-btn:active {
            transform: scale(0.97);
        }

        .tafsir-box {
            display: block;
            background: rgba(15, 92, 62, 0.20);
            border-right: 3px solid var(--gold);
            padding: 14px;
            margin: 10px 0 3px;
            border-radius: 10px;
            color: var(--text);
            font-family: "Amiri", serif;
            font-size: 0.98rem;
            line-height: 2;
            white-space: pre-wrap;
        }

        .result-title {
            color: var(--gold);
            font-family: "Amiri", serif;
            margin-bottom: 7px;
        }

        .no-results {
            text-align: center;
            padding: 40px 16px;
            color: var(--muted);
        }

        .error-box {
            text-align: center;
            padding: 18px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            line-height: 1.9;
        }

        .error-box strong {
            color: #e4aaaa;
        }
    </style>
</head>

<body>

<div class="quran-container">

    <div class="quran-header">
        <h2>📖 القرآن الكريم</h2>
    </div>

    <input
        id="searchInput"
        class="search-box"
        type="text"
        placeholder="🔍 ابحث عن كلمة أو آية..."
        autocomplete="off"
    >

    <div
        id="searchStatus"
        class="search-status"
    ></div>

    <div id="quranContent">
        <p class="no-results">
            جاري تحميل القرآن...
        </p>
    </div>

</div>

<script>
(function () {

    "use strict";

    /* =========================================================
       المتغيرات
    ========================================================= */

    let quranData = [];
    let tafsirData = null;
    let flatAyahs = [];
    let searchTimer = null;

    const container =
        document.getElementById("quranContent");

    const searchInput =
        document.getElementById("searchInput");

    const searchStatus =
        document.getElementById("searchStatus");


    /* =========================================================
       تنظيف النص العربي
    ========================================================= */

    function normalizeArabic(text) {

        if (!text) return "";

        return String(text)
            .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
            .replace(/ـ/g, "")
            .replace(/[إأٱآا]/g, "ا")
            .replace(/[ؤئ]/g, "ء")
            .replace(/ى/g, "ي")
            .replace(/ة/g, "ه")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
    }


    /* =========================================================
       استخراج النص
    ========================================================= */

    function extractText(value) {

        if (typeof value === "string") {
            return value.trim();
        }

        if (!value || typeof value !== "object") {
            return "";
        }

        const candidates = [
            value.ar,
            value.text,
            value.verse,
            value.aya,
            value.t,
            value.content,
            value.text_ar
        ];

        for (const candidate of candidates) {

            if (
                typeof candidate === "string" &&
                candidate.trim()
            ) {
                return candidate.trim();
            }

            if (
                candidate &&
                typeof candidate === "object"
            ) {
                const nested =
                    extractText(candidate);

                if (nested) {
                    return nested;
                }
            }
        }

        return "";
    }


    /* =========================================================
       اسم السورة
    ========================================================= */

    function getSurahName(surah, index) {

        if (!surah || typeof surah !== "object") {
            return "السورة " + (index + 1);
        }

        if (
            typeof surah.name === "string" &&
            surah.name.trim()
        ) {
            return surah.name.trim();
        }

        if (
            surah.name &&
            typeof surah.name === "object" &&
            typeof surah.name.ar === "string" &&
            surah.name.ar.trim()
        ) {
            return surah.name.ar.trim();
        }

        if (
            typeof surah.title === "string" &&
            surah.title.trim()
        ) {
            return surah.title.trim();
        }

        return "السورة " + (index + 1);
    }


    /* =========================================================
       استخراج الآيات
    ========================================================= */

    function getAyahs(surah) {

        if (!surah || typeof surah !== "object") {
            return [];
        }

        const raw =
            surah.ayahs ||
            surah.verses ||
            surah.a ||
            surah.ayat ||
            surah.items;

        if (!Array.isArray(raw)) {
            return [];
        }

        return raw
            .map(extractText)
            .filter(Boolean);
    }


    /* =========================================================
       توحيد بنية القرآن
    ========================================================= */

    function normalizeQuran(data) {

        let source = data;

        if (
            !Array.isArray(source) &&
            source &&
            typeof source === "object"
        ) {

            const possible =
                [
                    source.quran,
                    source.surahs,
                    source.suras,
                    source.data,
                    source.chapters,
                    source.items
                ];

            for (const candidate of possible) {

                if (Array.isArray(candidate)) {
                    source = candidate;
                    break;
                }
            }
        }


        /*
         * دعم كائن يحتوي على:
         * 1
         * 2
         * 3
         * ...
         */

        if (
            !Array.isArray(source) &&
            source &&
            typeof source === "object"
        ) {

            const keys =
                Object.keys(source)
                    .filter(key => /^\d+$/.test(key));

            if (keys.length > 0) {

                keys.sort(
                    (a, b) => Number(a) - Number(b)
                );

                source =
                    keys.map(
                        key => source[key]
                    );
            }
        }


        if (!Array.isArray(source)) {
            return [];
        }


        return source
            .map((surah, index) => {

                return {

                    number:
                        Number(
                            surah?.number ||
                            surah?.id ||
                            index + 1
                        ) || index + 1,

                    name:
                        getSurahName(
                            surah,
                            index
                        ),

                    ayahs:
                        getAyahs(surah)

                };

            })
            .filter(
                surah =>
                    surah.ayahs.length > 0
            );
    }


    /* =========================================================
       تحميل التفسير
    ========================================================= */

    async function loadTafsir() {

        try {

            const response =
                await fetch(
                    "./tafsir-saadi.json",
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            tafsirData =
                await response.json();

            console.log(
                "✅ تم تحميل تفسير السعدي"
            );

        } catch (error) {

            tafsirData = null;

            console.warn(
                "⚠️ تعذر تحميل تفسير السعدي:",
                error
            );
        }
    }


    /* =========================================================
       بناء البحث
    ========================================================= */

    function buildSearchIndex() {

        flatAyahs = [];

        quranData.forEach(
            (surah, surahIndex) => {

                surah.ayahs.forEach(
                    (text, ayahIndex) => {

                        flatAyahs.push({

                            surahIndex,

                            surahNumber:
                                surah.number,

                            surahName:
                                surah.name,

                            ayahNumber:
                                ayahIndex + 1,

                            text,

                            normalized:
                                normalizeArabic(
                                    text
                                )

                        });

                    }
                );

            }
        );
    }


    /* =========================================================
       عرض السور
    ========================================================= */

    function renderSurahList() {

        container.innerHTML = "";

        searchStatus.textContent = "";

        const list =
            document.createElement("div");

        list.className =
            "surah-list";


        quranData.forEach(
            (surah, index) => {

                const row =
                    document.createElement("div");

                row.className =
                    "surah-item";


                const main =
                    document.createElement("div");

                main.className =
                    "surah-main";


                const number =
                    document.createElement("span");

                number.className =
                    "surah-number";

                number.textContent =
                    surah.number;


                const name =
                    document.createElement("span");

                name.className =
                    "surah-name";

                name.textContent =
                    surah.name;


                const count =
                    document.createElement("span");

                count.className =
                    "surah-count";

                count.textContent =
                    surah.ayahs.length +
                    " آيات";


                main.appendChild(number);
                main.appendChild(name);

                row.appendChild(main);
                row.appendChild(count);

                /*
                 * مهم:
                 * هذا الحدث خاص بهذه السورة فقط.
                 */

                row.addEventListener(
                    "click",
                    function () {

                        openSurah(index);

                    }
                );

                list.appendChild(row);
            }
        );


        container.appendChild(list);
    }


    /* =========================================================
       جلب تفسير آية واحدة
    ========================================================= */

    function getTafsir(
        surahNumber,
        ayahNumber
    ) {

        if (!tafsirData) {
            return null;
        }


        /*
         * الصيغة الأساسية:
         *
         * {
         *   "2:255": "..."
         * }
         */

        const key =
            String(surahNumber) +
            ":" +
            String(ayahNumber);


        if (
            Object.prototype.hasOwnProperty.call(
                tafsirData,
                key
            )
        ) {

            if (
                typeof tafsirData[key] ===
                "string"
            ) {

                return tafsirData[key];
            }
        }


        /*
         * صيغة متداخلة:
         *
         * {
         *   "2": {
         *       "255": "..."
         *   }
         * }
         */

        if (
            tafsirData[String(surahNumber)] &&
            typeof
                tafsirData[String(surahNumber)]
                === "object"
        ) {

            const value =
                tafsirData[
                    String(surahNumber)
                ][
                    String(ayahNumber)
                ];

            if (typeof value === "string") {
                return value;
            }
        }


        /*
         * الصيغة الأصلية التي كان ملفك المرفوع
         * يستخدمها:
         *
         * {
         *   "tafsir": [
         *      [ ... ],
         *      [ ... ]
         *   ]
         * }
         */

        if (
            Array.isArray(
                tafsirData.tafsir
            )
        ) {

            const sIndex =
                Number(surahNumber) - 1;

            const aIndex =
                Number(ayahNumber) - 1;

            if (
                Array.isArray(
                    tafsirData.tafsir[sIndex]
                ) &&
                typeof
                    tafsirData.tafsir[sIndex][aIndex]
                    === "string"
            ) {

                return
                    tafsirData.tafsir[sIndex][aIndex];
            }
        }


        return null;
    }


    /* =========================================================
       إظهار التفسير
    ========================================================= */

    function toggleTafsir(
        surahNumber,
        ayahNumber,
        box,
        button
    ) {

        if (
            box.style.display ===
            "block"
        ) {

            box.style.display =
                "none";

            button.textContent =
                "تفسير";

            return;
        }


        const text =
            getTafsir(
                surahNumber,
                ayahNumber
            );


        box.innerHTML = "";


        const tafsirBox =
            document.createElement("div");

        tafsirBox.className =
            "tafsir-box";


        if (text) {

            tafsirBox.textContent =
                text;

        } else if (!tafsirData) {

            tafsirBox.textContent =
                "تعذر تحميل ملف تفسير السعدي. تأكد من وجود tafsir-saadi.json بجانب quran.html.";

        } else {

            tafsirBox.textContent =
                "التفسير غير متوفر لهذه الآية.";
        }


        box.appendChild(
            tafsirBox
        );


        box.style.display =
            "block";


        button.textContent =
            "إخفاء التفسير";
    }


    /* =========================================================
       فتح سورة كاملة
    ========================================================= */

    function openSurah(index) {

        const surah =
            quranData[index];

        if (!surah) {
            return;
        }


        container.innerHTML = "";


        /*
         * زر الرجوع
         */

        const back =
            document.createElement("button");

        back.type = "button";

        back.className =
            "back-btn";

        back.textContent =
            "← فهرس السور";


        back.addEventListener(
            "click",
            function () {

                renderSurahList();

                window.scrollTo(
                    0,
                    0
                );
            }
        );


        container.appendChild(
            back
        );


        /*
         * عنوان السورة
         */

        const title =
            document.createElement("h2");

        title.className =
            "section-title";

        title.textContent =
            "سورة " +
            surah.name;


        container.appendChild(
            title
        );


        /*
         * الآيات
         */

        const fragment =
            document.createDocumentFragment();


        surah.ayahs.forEach(
            (text, index) => {

                const ayahNumber =
                    index + 1;


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "ayah-card";


                const number =
                    document.createElement(
                        "span"
                    );

                number.className =
                    "ayah-number";

                number.textContent =
                    ayahNumber;


                const verse =
                    document.createElement(
                        "span"
                    );

                verse.textContent =
                    text;


                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "tafsir-btn";

                button.textContent =
                    "تفسير";


                const box =
                    document.createElement(
                        "div"
                    );

                box.style.display =
                    "none";


                button.addEventListener(
                    "click",
                    function () {

                        toggleTafsir(
                            surah.number,
                            ayahNumber,
                            box,
                            button
                        );

                    }
                );


                card.appendChild(
                    number
                );

                card.appendChild(
                    verse
                );

                card.appendChild(
                    button
                );

                card.appendChild(
                    box
                );


                fragment.appendChild(
                    card
                );

            }
        );


        container.appendChild(
            fragment
        );


        window.scrollTo(
            0,
            0
        );
    }


    /* =========================================================
       البحث
    ========================================================= */

    function performSearch(term) {

        const query =
            normalizeArabic(term);


        if (!query) {

            renderSurahList();

            return;
        }


        const results =
            flatAyahs.filter(
                item =>
                    item.normalized.includes(
                        query
                    )
            );


        searchStatus.textContent =
            results.length
                ? "تم العثور على " +
                  results.length +
                  " نتيجة"
                : "";


        if (!results.length) {

            container.innerHTML =
                '<p class="no-results">لا توجد نتائج مطابقة.</p>';

            return;
        }


        container.innerHTML = "";


        const fragment =
            document.createDocumentFragment();


        results.forEach(
            item => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "ayah-card";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "result-title";

                title.textContent =
                    "سورة " +
                    item.surahName +
                    " — الآية " +
                    item.ayahNumber;


                const number =
                    document.createElement(
                        "span"
                    );

                number.className =
                    "ayah-number";

                number.textContent =
                    item.ayahNumber;


                const verse =
                    document.createElement(
                        "span"
                    );

                verse.textContent =
                    item.text;


                const button =
                    document.createElement(
                        "button"
                    );

                button.type =
                    "button";

                button.className =
                    "tafsir-btn";

                button.textContent =
                    "تفسير";


                const box =
                    document.createElement(
                        "div"
                    );

                box.style.display =
                    "none";


                button.addEventListener(
                    "click",
                    function () {

                        toggleTafsir(
                            item.surahNumber,
                            item.ayahNumber,
                            box,
                            button
                        );

                    }
                );


                card.appendChild(
                    title
                );

                card.appendChild(
                    number
                );

                card.appendChild(
                    verse
                );

                card.appendChild(
                    button
                );

                card.appendChild(
                    box
                );


                fragment.appendChild(
                    card
                );
            }
        );


        container.appendChild(
            fragment
        );
    }


    /* =========================================================
       البحث الفوري
    ========================================================= */

    searchInput.addEventListener(
        "input",
        function () {

            const term =
                this.value.trim();


            if (searchTimer) {

                clearTimeout(
                    searchTimer
                );
            }


            if (!term) {

                renderSurahList();

                return;
            }


            searchStatus.textContent =
                "...";


            searchTimer =
                setTimeout(
                    function () {

                        performSearch(
                            term
                        );

                    },
                    200
                );

        }
    );


    /* =========================================================
       تحميل القرآن
    ========================================================= */

    async function start() {

        try {

            const response =
                await fetch(
                    "./quran-local.json",
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "quran-local.json HTTP " +
                    response.status
                );
            }


            const data =
                await response.json();


            quranData =
                normalizeQuran(data);


            if (!quranData.length) {

                throw new Error(
                    "لم يتم العثور على سور أو آيات داخل quran-local.json"
                );
            }


            /*
             * القرآن يظهر أولًا.
             */

            buildSearchIndex();
            renderSurahList();


            /*
             * ثم التفسير.
             * فشل التفسير لا يعطل القرآن.
             */

            await loadTafsir();


            console.log(
                "✅ القرآن محمل:",
                quranData.length,
                "سورة"
            );

        } catch (error) {

            console.error(
                "خطأ تحميل القرآن:",
                error
            );


            container.innerHTML =
                '<div class="error-box">' +
                '<strong>تعذر تحميل القرآن.</strong><br><br>' +
                'تأكد من وجود quran-local.json بجانب quran.html.' +
                '</div>';
        }
    }


    start();

})();
</script>

</body>
</html>
