<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>القرآن الكريم — الرفيق</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .ayah-text { font-family: 'Amiri', serif; font-size: 1.8rem; line-height: 2.5; text-align: center; color: var(--text); }
        .ayah-num { display: inline-block; width: 30px; height: 30px; border: 1px solid var(--gold); border-radius: 50%; font-size: 0.9rem; line-height: 30px; text-align: center; margin: 0 5px; color: var(--gold); }
    </style>
</head>
<body>
<div class="max">
    <header class="topbar">
        <a href="index.html" class="brand-mark">←</a>
        <div class="titlebox"><h1>القرآن الكريم</h1></div>
        <div class="brand-mark">📖</div>
    </header>
    <input type="text" id="searchInput" class="pill" style="width:100%; margin-bottom:20px;" placeholder="🔍 ابحث عن سورة..." oninput="filterSurahs()">
    <div id="status" style="text-align:center;">جاري التحميل...</div>
    <div id="surahList" class="grid2"></div>
    <div id="readerView" style="display:none;">
        <button class="pill" onclick="showList()">← الفهرس</button>
        <div class="prayer-card"><h2 id="readerTitle" style="font-family:'Amiri', serif; color:var(--gold);"></h2></div>
        <div id="quranContent" class="prayer-card ayah-text"></div>
    </div>
</div>
<script>
    let QURAN_DATA = null;
    async function loadData() {
        try {
            const res = await fetch('./quran-local.json');
            QURAN_DATA = await res.json();
            document.getElementById('status').style.display = 'none';
            renderList(QURAN_DATA);
        } catch (e) { document.getElementById('status').textContent = "فشل التحميل."; }
    }
    function renderList(data) {
        const list = document.getElementById('surahList');
        list.innerHTML = '';
        data.forEach((s, i) => {
            const card = document.createElement('a');
            card.className = 'feat-card'; card.onclick = () => showSurah(s);
            card.innerHTML = `<div class="icon-wrap">${i+1}</div><div class="t">${s.name}</div>`;
            list.appendChild(card);
        });
    }
    function showSurah(s) {
        document.getElementById('surahList').style.display = 'none';
        document.getElementById('readerView').style.display = 'block';
        document.getElementById('readerTitle').textContent = s.name;
        const content = document.getElementById('quranContent');
        content.innerHTML = '';
        let idx = 0;
        function render() {
            let html = '';
            for(let i=0; i<20 && idx<s.verses.length; i++) {
                html += s.verses[idx] + ` <span class="ayah-num">${idx+1}</span> `;
                idx++;
            }
            content.innerHTML += html;
            if(idx < s.verses.length) requestAnimationFrame(render);
        }
        render();
    }
    function showList() { document.getElementById('readerView').style.display = 'none'; document.getElementById('surahList').style.display = 'grid'; }
    loadData();
</script>
</body>
</html>
