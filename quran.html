<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>القرآن الكريم — الرفيق</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        .quran-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px;
        }

        .quran-header {
            text-align: center;
            padding: 20px 0 14px;
        }

        .quran-header h2 {
            margin: 0;
            color: var(--gold);
            font-family: "Amiri", serif;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin: 12px 0 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--gold);
        }

        .search-status {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            min-height: 20px;
            margin-bottom: 8px;
        }

        .surah-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .surah-item {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            transition: transform .15s ease, border-color .15s ease;
        }

        .surah-item:active {
            transform: scale(0.99);
        }

        .surah-main {
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .surah-number {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 9px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.10);
            color: var(--gold);
            font-size: 0.75rem;
            font-family: Arial, sans-serif;
        }

        .surah-name {
            color: var(--gold);
            font-family: "Amiri", serif;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .surah-count {
            color: var(--muted);
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 18px;
            border-radius: 99px;
            margin-bottom: 14px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .section-title {
            text-align: center;
            color: var(--gold);
            font-family: "Amiri", serif;
            margin: 8px 0 18px;
        }

        .ayah-card {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            line-height: 2.2;
            font-family: "Amiri", serif;
            font-size: 1.16rem;
        }

        .ayah-line {
            display: inline;
        }

        .ayah-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 29px;
            height: 29px;
            padding: 0 5px;
            margin-left: 8px;
            border: 1px solid rgba(212,175,55,0.35);
            border-radius: 50%;
            color: var(--gold);
            font-size: 0.78rem;
            line-height: 1;
            vertical-align: middle;
            font-family: Arial, sans-serif;
        }

        .tafsir-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            border-radius: 12px;
            padding: 3px 10px;
            font-size: 0.72rem;
            cursor: pointer;
            margin-right: 8px;
            vertical-align: middle;
            font-family: inherit;
        }

        .tafsir-btn:disabled {
            opacity: .65;
            cursor: wait;
        }

        .tafsir-box {
            display: block;
            background: rgba(15, 92, 62, 0.20);
            border-right: 3px solid var(--gold);
            padding: 14px;
            margin: 10px 0 3px;
            border-radius: 10px;
            color: var(--text);
            font-family: "Amiri", serif;
            font-size: 0.98rem;
            line-height: 2;
            white-space: pre-wrap;
        }

        .result-title {
            color: var(--gold);
            font-family: "Amiri", serif;
            margin-bottom: 7px;
        }

        .no-results {
            text-align: center;
            padding: 40px 16px;
            color: var(--muted);
        }

        .error-box {
            text-align: center;
            padding: 18px;
            border-radius: 14px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            line-height: 1.9;
        }

        .error-box strong {
            color: #e4aaaa;
        }
    </style>
</head>

<body>

<div class="quran-container">

    <div class="quran-header">
        <h2>📖 القرآن الكريم</h2>
    </div>

    <input
        id="searchInput"
        class="search-box"
        type="text"
        placeholder="🔍 ابحث عن كلمة أو آية..."
        autocomplete="off"
        inputmode="search"
    >

    <div
        id="searchStatus"
        class="search-status"
        aria-live="polite"
    ></div>

    <div id="quranContent">
        <p class="no-results">
            جاري تحميل القرآن...
        </p>
    </div>

</div>

<script>
(function () {

    "use strict";

    /* =========================================================
       الحالة — مصممة لتقليل الذاكرة والعمل عند البداية
    ========================================================= */

    let quranData = [];
    let tafsirData = null;
    let tafsirPromise = null;
    let searchIndex = null;
    let searchTimer = null;
    let currentView = "list";

    const container =
        document.getElementById("quranContent");

    const searchInput =
        document.getElementById("searchInput");

    const searchStatus =
        document.getElementById("searchStatus");


    /* =========================================================
       تطبيع عربي — يستخدم فقط عند الحاجة
    ========================================================= */

    function normalizeArabic(text) {

        if (!text) return "";

        return String(text)
            .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")
            .replace(/ـ/g, "")
            .replace(/[إأٱآا]/g, "ا")
            .replace(/[ؤئ]/g, "ء")
            .replace(/ى/g, "ي")
            .replace(/ة/g, "ه")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
    }


    /* =========================================================
       استخراج النص من بنية الآية
    ========================================================= */

    function extractText(value) {

        if (typeof value === "string") {
            return value.trim();
        }

        if (!value || typeof value !== "object") {
            return "";
        }

        const candidates = [
            value.ar,
            value.text,
            value.verse,
            value.aya,
            value.t,
            value.content,
            value.text_ar
        ];

        for (const candidate of candidates) {

            if (
                typeof candidate === "string" &&
                candidate.trim()
            ) {
                return candidate.trim();
            }

            if (
                candidate &&
                typeof candidate === "object"
            ) {
                const nested = extractText(candidate);
                if (nested) return nested;
            }
        }

        return "";
    }


    /* =========================================================
       اسم السورة
    ========================================================= */

    function getSurahName(surah, index) {

        if (!surah || typeof surah !== "object") {
            return "السورة " + (index + 1);
        }

        if (
            typeof surah.name === "string" &&
            surah.name.trim()
        ) {
            return surah.name.trim();
        }

        if (
            surah.name &&
            typeof surah.name === "object" &&
            typeof surah.name.ar === "string" &&
            surah.name.ar.trim()
        ) {
            return surah.name.ar.trim();
        }

        if (
            typeof surah.title === "string" &&
            surah.title.trim()
        ) {
            return surah.title.trim();
        }

        return "السورة " + (index + 1);
    }


    /* =========================================================
       استخراج الآيات
    ========================================================= */

    function getAyahs(surah) {

        if (!surah || typeof surah !== "object") {
            return [];
        }

        const raw =
            surah.ayahs ||
            surah.verses ||
            surah.a ||
            surah.ayat ||
            surah.items;

        if (!Array.isArray(raw)) {
            return [];
        }

        return raw
            .map(extractText)
            .filter(Boolean);
    }


    /* =========================================================
       توحيد بنية القرآن
    ========================================================= */

    function normalizeQuran(data) {

        let source = data;

        if (
            !Array.isArray(source) &&
            source &&
            typeof source === "object"
        ) {

            const possible = [
                source.quran,
                source.surahs,
                source.suras,
                source.data,
                source.chapters,
                source.items
            ];

            for (const candidate of possible) {
                if (Array.isArray(candidate)) {
                    source = candidate;
                    break;
                }
            }
        }

        if (
            !Array.isArray(source) &&
            source &&
            typeof source === "object"
        ) {

            const keys = Object.keys(source)
                .filter(key => /^\d+$/.test(key))
                .sort((a, b) => Number(a) - Number(b));

            if (keys.length > 0) {
                source = keys.map(key => source[key]);
            }
        }

        if (!Array.isArray(source)) {
            return [];
        }

        return source
            .map((surah, index) => ({
                number:
                    Number(
                        surah?.number ||
                        surah?.id ||
                        index + 1
                    ) || index + 1,
                name:
                    getSurahName(surah, index),
                ayahs:
                    getAyahs(surah)
            }))
            .filter(surah => surah.ayahs.length > 0);
    }


    /* =========================================================
       تحميل التفسير عند الحاجة فقط
       لا يحدث أثناء فتح صفحة القرآن.
    ========================================================= */

    async function ensureTafsirLoaded() {

        if (tafsirData) {
            return tafsirData;
        }

        if (tafsirPromise) {
            return tafsirPromise;
        }

        tafsirPromise = fetch("./tafsir-saadi.json")
            .then(function (response) {

                if (!response.ok) {
                    throw new Error(
                        "تعذر تحميل tafsir-saadi.json (HTTP " +
                        response.status +
                        ")"
                    );
                }

                return response.json();
            })
            .then(function (data) {

                tafsirData = data;

                console.log(
                    "✅ تم تحميل تفسير السعدي عند الطلب"
                );

                return tafsirData;
            })
            .catch(function (error) {

                tafsirPromise = null;

                console.error(
                    "❌ تعذر تحميل تفسير السعدي:",
                    error
                );

                throw error;
            });

        return tafsirPromise;
    }


    /* =========================================================
       استخراج تفسير آية — يدعم البنى المعروفة
    ========================================================= */

    function getTafsirFromData(data, surahNumber, ayahNumber) {

        if (!data || typeof data !== "object") {
            return null;
        }

        const s = String(surahNumber);
        const a = String(ayahNumber);
        const key = s + ":" + a;

        /* 1) مفاتيح مسطحة: {"2:255":"..."} */
        if (
            Object.prototype.hasOwnProperty.call(data, key)
        ) {

            const value = data[key];

            return typeof value === "string"
                ? value
                : extractText(value) || null;
        }

        /* 2) بنية متداخلة: {"2":{"255":"..."}} */
        if (
            data[s] &&
            typeof data[s] === "object" &&
            Object.prototype.hasOwnProperty.call(data[s], a)
        ) {

            const value = data[s][a];

            return typeof value === "string"
                ? value
                : extractText(value) || null;
        }

        /* 3) {tafsir:[ [..], [..] ]} */
        if (Array.isArray(data.tafsir)) {

            const surahIndex =
                Number(surahNumber) - 1;

            const ayahIndex =
                Number(ayahNumber) - 1;

            const surahData =
                data.tafsir[surahIndex];

            if (Array.isArray(surahData)) {

                const value =
                    surahData[ayahIndex];

                if (typeof value === "string") {
                    return value;
                }

                const extracted =
                    extractText(value);

                if (extracted) {
                    return extracted;
                }
            }
        }

        /* 4) {data:[...]}, {verses:[...]} أو مصفوفة سجلات */
        const records =
            Array.isArray(data)
                ? data
                : (
                    Array.isArray(data.data)
                        ? data.data
                        : (
                            Array.isArray(data.verses)
                                ? data.verses
                                : null
                        )
                );

        if (records) {

            for (const record of records) {

                if (!record || typeof record !== "object") {
                    continue;
                }

                const rs =
                    Number(
                        record.surah ||
                        record.surahNumber ||
                        record.chapter ||
                        record.chapterNumber
                    );

                const ra =
                    Number(
                        record.ayah ||
                        record.ayahNumber ||
                        record.verse ||
                        record.verseNumber
                    );

                if (rs === Number(s) && ra === Number(a)) {

                    return (
                        typeof record.tafsir === "string"
                            ? record.tafsir
                            : extractText(record.text) ||
                              extractText(record.content) ||
                              null
                    );
                }
            }
        }

        return null;
    }


    /* =========================================================
       إظهار التفسير — التحميل مؤجل حتى الضغط
    ========================================================= */

    async function showTafsir(
        surahNumber,
        ayahNumber,
        box,
        button
    ) {

        if (
            box.dataset.open === "1"
        ) {

            box.style.display = "none";
            box.dataset.open = "0";
            button.textContent = "تفسير";
            return;
        }

        box.style.display = "block";
        box.dataset.open = "1";
        box.innerHTML = "";
        button.disabled = true;
        button.textContent = "جاري تحميل التفسير...";

        const loading =
            document.createElement("div");

        loading.className = "tafsir-box";
        loading.textContent = "جاري تحميل تفسير السعدي...";

        box.appendChild(loading);

        try {

            const data =
                await ensureTafsirLoaded();

            const text =
                getTafsirFromData(
                    data,
                    surahNumber,
                    ayahNumber
                );

            box.innerHTML = "";

            const tafsirBox =
                document.createElement("div");

            tafsirBox.className = "tafsir-box";

            tafsirBox.textContent =
                text ||
                "التفسير غير متوفر لهذه الآية.";

            box.appendChild(tafsirBox);

            button.textContent = "إخفاء التفسير";

        } catch (error) {

            box.innerHTML = "";

            const tafsirBox =
                document.createElement("div");

            tafsirBox.className = "tafsir-box";

            tafsirBox.textContent =
                "تعذر تحميل تفسير السعدي. تأكد من وجود tafsir-saadi.json بجانب quran.html.";

            box.appendChild(tafsirBox);

            button.textContent = "إعادة محاولة التفسير";
        }

        button.disabled = false;
    }


    /* =========================================================
       عنصر زر التفسير
    ========================================================= */

    function createTafsirButton(
        surahNumber,
        ayahNumber
    ) {

        const button =
            document.createElement("button");

        button.type = "button";
        button.className = "tafsir-btn";
        button.textContent = "تفسير";

        const box =
            document.createElement("div");

        box.style.display = "none";
        box.dataset.open = "0";

        button.addEventListener(
            "click",
            function () {
                showTafsir(
                    surahNumber,
                    ayahNumber,
                    box,
                    button
                );
            }
        );

        return {
            button,
            box
        };
    }


    /* =========================================================
       عرض فهرس السور
    ========================================================= */

    function renderSurahList() {

        currentView = "list";
        searchStatus.textContent = "";
        container.innerHTML = "";

        const list =
            document.createElement("div");

        list.className = "surah-list";

        const fragment =
            document.createDocumentFragment();

        quranData.forEach(function (surah, index) {

            const row =
                document.createElement("div");

            row.className = "surah-item";
            row.setAttribute("role", "button");
            row.setAttribute("tabindex", "0");

            const main =
                document.createElement("div");

            main.className = "surah-main";

            const number =
                document.createElement("span");

            number.className = "surah-number";
            number.textContent = surah.number;

            const name =
                document.createElement("span");

            name.className = "surah-name";
            name.textContent = surah.name;

            const count =
                document.createElement("span");

            count.className = "surah-count";
            count.textContent =
                surah.ayahs.length + " آيات";

            main.appendChild(number);
            main.appendChild(name);
            row.appendChild(main);
            row.appendChild(count);

            const open = function () {
                openSurah(index);
            };

            row.addEventListener("click", open);

            row.addEventListener("keydown", function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {
                    event.preventDefault();
                    open();
                }
            });

            fragment.appendChild(row);
        });

        list.appendChild(fragment);
        container.appendChild(list);
    }


    /* =========================================================
       فتح سورة
    ========================================================= */

    function openSurah(index) {

        const surah =
            quranData[index];

        if (!surah) return;

        currentView = "surah";
        searchStatus.textContent = "";
        container.innerHTML = "";

        const back =
            document.createElement("button");

        back.type = "button";
        back.className = "back-btn";
        back.textContent = "← فهرس السور";

        back.addEventListener(
            "click",
            function () {
                searchInput.value = "";
                renderSurahList();
                window.scrollTo(0, 0);
            }
        );

        container.appendChild(back);

        const title =
            document.createElement("h2");

        title.className = "section-title";
        title.textContent = "سورة " + surah.name;

        container.appendChild(title);

        const fragment =
            document.createDocumentFragment();

        surah.ayahs.forEach(function (text, index) {

            const ayahNumber = index + 1;

            const card =
                document.createElement("div");

            card.className = "ayah-card";

            const number =
                document.createElement("span");

            number.className = "ayah-number";
            number.textContent = ayahNumber;

            const verse =
                document.createElement("span");

            verse.className = "ayah-line";
            verse.textContent = text;

            const tafsir =
                createTafsirButton(
                    surah.number,
                    ayahNumber
                );

            card.appendChild(number);
            card.appendChild(verse);
            card.appendChild(tafsir.button);
            card.appendChild(tafsir.box);

            fragment.appendChild(card);
        });

        container.appendChild(fragment);
        window.scrollTo(0, 0);
    }


    /* =========================================================
       بناء فهرس البحث عند أول استخدام فقط
    ========================================================= */

    function ensureSearchIndex() {

        if (searchIndex) {
            return searchIndex;
        }

        const index = [];

        for (
            let surahIndex = 0;
            surahIndex < quranData.length;
            surahIndex++
        ) {

            const surah = quranData[surahIndex];

            for (
                let ayahIndex = 0;
                ayahIndex < surah.ayahs.length;
                ayahIndex++
            ) {

                const text =
                    surah.ayahs[ayahIndex];

                index.push({
                    surahIndex,
                    surahNumber: surah.number,
                    surahName: surah.name,
                    ayahNumber: ayahIndex + 1,
                    text,
                    normalized: normalizeArabic(text)
                });
            }
        }

        searchIndex = index;

        console.log(
            "🔎 تم بناء فهرس البحث عند الطلب:",
            searchIndex.length,
            "آية"
        );

        return searchIndex;
    }


    /* =========================================================
       عرض نتائج البحث
    ========================================================= */

    function performSearch(term) {

        if (!quranData.length) {
            return;
        }

        const query =
            normalizeArabic(term);

        if (!query) {
            renderSurahList();
            return;
        }

        const index =
            ensureSearchIndex();

        const results = [];

        for (const item of index) {

            if (
                item.normalized.includes(query)
            ) {
                results.push(item);
            }
        }

        searchStatus.textContent =
            results.length
                ? "تم العثور على " + results.length + " نتيجة"
                : "";

        container.innerHTML = "";

        if (!results.length) {

            const empty =
                document.createElement("p");

            empty.className = "no-results";
            empty.textContent =
                "لا توجد نتائج مطابقة.";

            container.appendChild(empty);
            return;
        }

        const fragment =
            document.createDocumentFragment();

        for (const item of results) {

            const card =
                document.createElement("div");

            card.className = "ayah-card";

            const title =
                document.createElement("div");

            title.className = "result-title";
            title.textContent =
                "سورة " +
                item.surahName +
                " — الآية " +
                item.ayahNumber;

            const number =
                document.createElement("span");

            number.className = "ayah-number";
            number.textContent = item.ayahNumber;

            const verse =
                document.createElement("span");

            verse.className = "ayah-line";
            verse.textContent = item.text;

            const tafsir =
                createTafsirButton(
                    item.surahNumber,
                    item.ayahNumber
                );

            card.appendChild(title);
            card.appendChild(number);
            card.appendChild(verse);
            card.appendChild(tafsir.button);
            card.appendChild(tafsir.box);

            fragment.appendChild(card);
        }

        container.appendChild(fragment);
    }


    /* =========================================================
       البحث — Debounce خفيف
    ========================================================= */

    searchInput.addEventListener(
        "input",
        function () {

            const term =
                this.value.trim();

            if (searchTimer) {
                clearTimeout(searchTimer);
            }

            if (!term) {
                renderSurahList();
                return;
            }

            searchStatus.textContent = "...";

            searchTimer =
                setTimeout(function () {
                    performSearch(term);
                }, 180);
        }
    );


    /* =========================================================
       تحميل القرآن — التفسير لا يُحمّل هنا
    ========================================================= */

    async function start() {

        try {

            const response =
                await fetch(
                    "./quran-local.json"
                );

            if (!response.ok) {
                throw new Error(
                    "quran-local.json HTTP " +
                    response.status
                );
            }

            const data =
                await response.json();

            quranData =
                normalizeQuran(data);

            if (!quranData.length) {
                throw new Error(
                    "لم يتم العثور على سور أو آيات داخل quran-local.json"
                );
            }

            /*
             * مهم جدًا:
             * لا نبني فهرس البحث هنا.
             * ولا نحمل التفسير هنا.
             */

            searchIndex = null;
            tafsirData = null;
            tafsirPromise = null;

            renderSurahList();

            console.log(
                "✅ القرآن جاهز:",
                quranData.length,
                "سورة"
            );

        } catch (error) {

            console.error(
                "❌ خطأ تحميل القرآن:",
                error
            );

            container.innerHTML =
                "";

            const errorBox =
                document.createElement("div");

            errorBox.className = "error-box";

            const strong =
                document.createElement("strong");

            strong.textContent =
                "تعذر تحميل القرآن.";

            errorBox.appendChild(strong);

            errorBox.appendChild(
                document.createElement("br")
            );

            errorBox.appendChild(
                document.createTextNode(
                    "تأكد من وجود quran-local.json بجانب quran.html."
                )
            );

            container.appendChild(errorBox);
        }
    }


    /* =========================================================
       بدء الصفحة
    ========================================================= */

    start();

})();
</script>

</body>
</html>
