<script>
    function shareApp() {
        const url = window.location.origin + window.location.pathname.replace('more.html', 'index.html');
        if (navigator.share) { navigator.share({ title: 'تطبيق الرفيق', text: 'رفيقك إلى الخير', url: url }); }
        else { alert('رابط التطبيق: ' + url); }
    }
